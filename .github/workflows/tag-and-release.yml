# Tags a new release with a new version, and automatically publishes its
# sources into the release tag.
name: Tag and Release

on:
 schedule:
 - cron: '0 0 10 * *'
 workflow_dispatch:

jobs:
 # The scheduled run used to bump a version whether or not anything had
 # landed, so the same tree was released again and again. This job asks the
 # only question that matters -- did anything get committed since the last
 # release? -- and every job below hangs off the answer.
 check:
  runs-on: ubuntu-latest
  outputs:
   changed: ${{ steps.changes.outputs.changed }}
  steps:
   - name: Checkout
     uses: actions/checkout@v4
     with:
      # Full history and tags: `git describe` needs both.
      fetch-depth: 0
   - name: Look for commits since the last release
     id: changes
     run: |
      set -o errexit -o nounset -o pipefail
      latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
      if [ -z "${latest}" ]; then
       echo "No tag yet; releasing."
       echo "changed=true" >> "${GITHUB_OUTPUT}"
       exit 0
      fi
      if [ "$(git rev-list -n 1 "${latest}")" = "$(git rev-parse HEAD)" ]; then
       echo "HEAD is already released as ${latest}. Nothing to release."
       echo "changed=false" >> "${GITHUB_OUTPUT}"
      else
       echo "$(git rev-list --count "${latest}"..HEAD) commit(s) since ${latest}; releasing."
       echo "changed=true" >> "${GITHUB_OUTPUT}"
      fi

 tag:
  needs: check
  if: ${{ needs.check.outputs.changed == 'true' }}
  runs-on: ubuntu-latest
  outputs:
   tag_name: ${{ steps.tag_version.outputs.new_tag }}
  steps:
  - name: Setup bazel
    uses: bazel-contrib/setup-bazel@0.15.0
    with:
     bazelisk-cache: true
     disk-cache: ${{ github.workflow }}
     repository-cache: true
  - name: Checkout
    uses: actions/checkout@v4
  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y bubblewrap
      # Ubuntu 24.04 restricts unprivileged user namespaces.
      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
  - name: "Test"
    run: "bazel test --test_output=errors //..."
  - name: "Build integration (partially-installed)"
    run: "cd integration/partially-installed && bazel build //..."
  - name: "Build integration (with-nix-clang)"
    run: "cd integration/with-nix-clang && bazel build //..."
  - name: Bump version and push tag
    id: tag_version
    uses: mathieudutour/github-tag-action@v6.2
    with:
     github_token: ${{ secrets.GITHUB_TOKEN }}
     release_branches: main
  - name: Create a GitHub release
    uses: ncipollo/release-action@v1
    with:
     tag: ${{ steps.tag_version.outputs.new_tag }}
     generateReleaseNotes: true
  - name: Get release tag
    id: get_version
    run: echo "VERSION=${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_ENV
  - name: Get repo name
    id: get_repo_name
    run: echo "REPO_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

  - name: "Prepare source archive release artifact"
    uses: thedoctor0/zip-release@0.7.5
    with:
     type: 'zip'
     filename: "${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"
     exclusions: '*.git* /*node_modules/* .editorconfig /bazel-*'

  - name: "Upload source archive"
    uses: ncipollo/release-action@v1
    env:
     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
     tag: ${{ steps.tag_version.outputs.new_tag }}
     allowUpdates: true
     artifacts: "${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"

 publish-my-registry:
  needs: tag
  if: ${{ needs.tag.outputs.tag_name != '' }}
  uses: ./.github/workflows/publish.yml
  with:
   tag_name: ${{ needs.tag.outputs.tag_name }}
  secrets:
   BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}


